  <text class="h" x="70" y="140">UI-Entwurf</text><text class="t" x="70" y="178">map_raw: 3.740 Punkte</text><text class="s" x="70" y="210">Sourcepath: alte x90-Datei</text><text class="s" x="70" y="240">Datei selbst: nur 3.714 Punkte</text>
  <rect class="warn" x="490" y="100" width="360" height="170" rx="14"/>
