    <style>
      .bg{fill:#09111b}.box{fill:#101d2b;stroke:#4c7999;stroke-width:2}.warn{fill:#2a1d0d;stroke:#f2a33a;stroke-width:3}.good{fill:#10271f;stroke:#48d597;stroke-width:3}.bad{fill:#2d1414;stroke:#ff6b6b;stroke-width:3}.t{fill:#e7f2ff;font:22px sans-serif}.s{fill:#a9bfd2;font:17px sans-serif}.h{fill:#fff;font:bold 25px sans-serif}.a{stroke:#76c7ff;stroke-width:3;marker-end:url(#arrow);fill:none}.dash{stroke:#ffb454;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow);fill:none}
    </style>
