<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" role="img" aria-label="Ablauf MK2 Materialauswahl"><rect width="960" height="100%" rx="20" fill="#101820"/><style>text{font-family:Bahnschrift,Segoe UI,Arial,sans-serif;fill:#e1e5e6}.n{fill:#55d6e7;font-size:22px;font-weight:700}.t{font-size:18px}</style><text x="32" y="46" font-size="22">MK2 Materialauswahl · Ablauf</text><rect x="24" y="72" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="112">01</text><text class="t" x="100" y="102">Am MK2 BROWSE öffnen und das Auswahlrad zu einem Material drehen.</text><path d="M60 166v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="182" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="222">02</text><text class="t" x="100" y="212">Nach der Auswahl Materialname, Status und Standbild im Fenster prüfen.</text><path d="M60 276v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="292" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="332">03</text><text class="t" x="100" y="322">Bei verfügbarer Auswahl das Rad drücken, um das Material zu laden.</text><path d="M60 386v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="402" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="442">04</text><text class="t" x="100" y="432">Bei nicht verfügbarer Vorschau ein anderes Material wählen oder den</text><text class="t" x="100" y="456">Bibliotheksstatus prüfen.</text></svg>