<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" role="img" aria-label="Ablauf MIDI-Zuordnung"><rect width="960" height="100%" rx="20" fill="#101820"/><style>text{font-family:Bahnschrift,Segoe UI,Arial,sans-serif;fill:#e1e5e6}.n{fill:#55d6e7;font-size:22px;font-weight:700}.t{font-size:18px}</style><text x="32" y="46" font-size="22">MIDI-Zuordnung · Ablauf</text><rect x="24" y="72" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="112">01</text><text class="t" x="100" y="102">Timeline → MIDI · Controller öffnen und Eingabegerät wählen.</text><path d="M60 166v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="182" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="222">02</text><text class="t" x="100" y="212">MIDI aktivieren, beim gewünschten Ziel Lernen drücken und Regler/Pad bewegen.</text><path d="M60 276v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="292" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="332">03</text><text class="t" x="100" y="322">Ziel, Min/Max und relativen/absoluten Modus prüfen.</text><path d="M60 386v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="402" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="442">04</text><text class="t" x="100" y="432">Mapping speichern; Live-Werte freigeben beendet temporäre Overrides.</text></svg>