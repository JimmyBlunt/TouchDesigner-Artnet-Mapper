<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-label="MK2: Tasten, Displays und Aufnahmegesten; schematische Belegung"><rect width="1200" height="940" rx="24" fill="#101820"/><style>text{font-family:Bahnschrift,Segoe UI,Arial,sans-serif;fill:#e1e5e6}.h{font-size:25px;font-weight:600}.t{font-size:18px}.s{font-size:16px;fill:#a9b2b5}</style><text class="h" x="40" y="55">MASCHINE MK2 · Belegung im Projekt</text><text class="s" x="40" y="87">Der aktuelle Modus bestimmt die Aktion. Schematisch, kein Hardwarefoto.</text><rect x="40" y="115" width="540" height="135" rx="14" fill="#232a25" stroke="#354139"/><text class="h" x="62" y="152">Obere Tasten 1–8</text><text class="s" x="62" y="187">Hauptbild: TD-/MM-Parameterseite wählen</text><text class="s" x="62" y="215">Browser: 1 ALL · 2 FAV · 3 CAT · 8 Favorit</text><rect x="610" y="115" width="550" height="135" rx="14" fill="#232a25" stroke="#354139"/><text class="h" x="632" y="152">Drehregler 1–8</text><text class="s" x="632" y="187">Parameter der sichtbaren Seite bearbeiten</text><text class="s" x="632" y="215">Show: Werteänderung nur während Aufnahme</text><rect x="40" y="275" width="540" height="180" rx="14" fill="#232a25" stroke="#354139"/><text class="h" x="62" y="312">Linkes Display</text><text class="s" x="62" y="347">Materialbild / Name / Modus</text><text class="s" x="62" y="375">Show: Status, vergangene und übrige Zeit</text><text class="s" x="62" y="403">Fortschritt, Übergang; unten Cuewerte</text><rect x="610" y="275" width="550" height="180" rx="14" fill="#232a25" stroke="#354139"/><text class="h" x="632" y="312">Rechtes Display</text><text class="s" x="632" y="347">Parameter / Werte / ausgewähltes Detail</text><text class="s" x="632" y="375">Browser: Auswahl und Zuweisungen</text><text class="s" x="632" y="403">Padansicht oder Bestätigung je nach Kontext</text><rect x="40" y="480" width="540" height="310" rx="14" fill="#232a25" stroke="#354139"/><text class="h" x="62" y="517">Navigation &amp; Transport</text><text class="t" x="60" y="556">STEP</text><text class="s" x="205" y="556">Material ↔ Show</text><text class="t" x="60" y="588">BROWSE</text><text class="s" x="205" y="588">Materialliste; Rad wählt / bestätigt</text><text class="t" x="60" y="620">SCENE</text><text class="s" x="205" y="620">Pad-Raster und Preset-Menü</text><text class="t" x="60" y="652">SELECT</text><text class="s" x="205" y="652">Browsermaterial → Bank → Pad</text><text class="t" x="60" y="684">A–H</text><text class="s" x="205" y="684">Pad-Bank / Show-Parameterblock</text><text class="t" x="60" y="716">PLAY / ◀ / ▶</text><text class="s" x="205" y="716">Start / vorherige / nächste Cue</text><text class="t" x="60" y="748">RESTART</text><text class="s" x="205" y="748">Showanfang + Wiedergabe</text><text class="h" x="640" y="510">Pads · Hardwarezählung</text><rect x="640" y="535" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="683" y="569">13</text><rect x="770" y="535" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="813" y="569">14</text><rect x="900" y="535" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="943" y="569">15</text><rect x="1030" y="535" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="1073" y="569">16</text><rect x="640" y="599" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="683" y="633">9</text><rect x="770" y="599" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="813" y="633">10</text><rect x="900" y="599" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="943" y="633">11</text><rect x="1030" y="599" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="1073" y="633">12</text><rect x="640" y="663" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="683" y="697">5</text><rect x="770" y="663" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="813" y="697">6</text><rect x="900" y="663" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="943" y="697">7</text><rect x="1030" y="663" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="1073" y="697">8</text><rect x="640" y="727" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="683" y="761">1</text><rect x="770" y="727" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="813" y="761">2</text><rect x="900" y="727" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="943" y="761">3</text><rect x="1030" y="727" width="110" height="52" rx="8" fill="#253943" stroke="#55d6e7"/><text class="t" x="1073" y="761">4</text><rect x="40" y="820" width="1120" height="90" rx="14" fill="#232a25" stroke="#354139"/><text class="h" x="62" y="857">REC loslassen → neue Cue · REC + ERASE → Automation im Clip</text><text class="s" x="62" y="892">REC erneut beendet die Aufnahme. ERASE allein löscht nichts. Danach Show speichern.</text></svg>