<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 642" role="img" aria-label="Ablauf PXLBLZ / Art-Net Installation"><rect width="960" height="100%" rx="20" fill="#101820"/><style>text{font-family:Bahnschrift,Segoe UI,Arial,sans-serif;fill:#e1e5e6}.n{fill:#55d6e7;font-size:22px;font-weight:700}.t{font-size:18px}</style><text x="32" y="46" font-size="22">PXLBLZ / Art-Net Installation · Ablauf</text><rect x="24" y="72" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="112">01</text><text class="t" x="100" y="102">Im Layout oder Pixel Mapper PXLBLZ / ART-NET öffnen; Status prüfen.</text><path d="M60 166v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="182" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="222">02</text><text class="t" x="100" y="212">Exportpaket erstellen; Werte und maskierte Plätze prüfen.</text><path d="M60 276v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="292" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="332">03</text><text class="t" x="100" y="322">Ausgabe testen · lokal ausführen; anschließend die Pattern-Koordinaten wählen und</text><text class="t" x="100" y="346">PXLBLZ synchronisieren.</text><path d="M60 386v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="402" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="442">04</text><text class="t" x="100" y="432">Routing anwenden; die TouchDesigner-Ausgabe wird zuvor gestoppt.</text><path d="M60 496v12m-4-4 4 4 4-4" stroke="#aeb7ba" fill="none"/><rect x="24" y="512" width="912" height="90" rx="12" fill="#232a25"/><text class="n" x="46" y="552">05</text><text class="t" x="100" y="542">Pattern-Vorschau prüfen; erst danach Ausgabe einschalten. Ausgabe stoppen beendet</text><text class="t" x="100" y="566">die Ausgabe.</text></svg>