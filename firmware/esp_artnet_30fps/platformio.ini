[platformio]
default_envs = esp32_single
build_cache_dir = ${sysenv.LOCALAPPDATA}/CodexESP30/cache
libdeps_dir = ${sysenv.LOCALAPPDATA}/CodexESP30/libdeps

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED@3.9.15
monitor_speed = 115200
build_flags = -DFASTLED_ESP32_I2S=1
              -DCORE_DEBUG_LEVEL=0

[env:esp32_single]
build_src_flags = -DPANEL_PROFILE=1

[env:esp32_testnode731]
build_src_flags = -DPANEL_PROFILE=731

[env:esp32_testnode_mixed]
build_src_flags = -DPANEL_PROFILE=768

[env:esp32_virtual_mixed1755]
build_src_flags = -DPANEL_PROFILE=1755

[env:esp32_five]
build_src_flags = -DPANEL_PROFILE=5

[env:esp32_six]
build_src_flags = -DPANEL_PROFILE=6
